<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeezKnees Test</title>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    header { background: #000; color: #D4A017; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .menu-toggle { font-size: 2rem; background: none; border: none; color: #D4A017; cursor: pointer; }

    .navbar { background: #222; }
    .nav-menu { list-style: none; margin: 0; padding: 0; display: none; flex-direction: column; }
    .nav-menu.active { display: flex; }
    .nav-menu li { border-bottom: 1px solid #333; }
    .nav-menu a { color: gold; text-decoration: none; padding: 0.75rem 1rem; display: block; }

    .dropdown-menu { display: none; background: #444; list-style: none; margin: 0; padding: 0; }
    .dropdown-menu li a { padding-left: 2rem; }
    .dropdown.open .dropdown-menu { display: block; }

    #backToTop { position: fixed; bottom: 1rem; right: 1rem; display: none; background: gold; border: none; padding: 0.5rem 1rem; cursor: pointer; }

    .cookie-popup { background: #fff8dc; padding: 1rem; position: fixed; bottom: 1rem; left: 1rem; right: 1rem; max-width: 400px; z-index: 999; border: 1px solid #ccc; border-radius: 8px; display: none; }
    .cookie-buttons { display: flex; gap: 1rem; margin-top: 1rem; }
    .cookie-buttons button { padding: 0.5rem 1rem; background: #D4A017; border: none; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>BeezKnees Test</h1>
    <button id="menuToggle" class="menu-toggle">☰</button>
  </header>

  <nav class="navbar">
    <ul class="nav-menu">
      <li><a href="#">Home</a></li>
      <li class="dropdown">
        <a href="#">Dropdown</a>
        <button class="dropdown-toggle">▼</button>
        <ul class="dropdown-menu">
          <li><a href="#">Option 1</a></li>
          <li><a href="#">Option 2</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <main style="padding: 2rem;">
    <p>Scroll down to see the back to top button.</p>
    <div style="height: 1000px;"></div>
  </main>

  <!-- Cookie Consent Popup -->
  <div id="cookie-consent" class="cookie-popup">
    <h2>Cookies 🍪</h2>
    <p>Accept cookies?</p>
    <form>
      <label><input type="checkbox" checked disabled> Essential</label><br>
      <label><input type="checkbox" id="analytics"> Analytics</label><br>
      <label><input type="checkbox" id="marketing"> Marketing</label>
    </form>
    <div class="cookie-buttons">
      <button id="accept-selected">Accept Selected</button>
      <button id="accept-all">Accept All</button>
    </div>
  </div>

  <!-- Back to Top Button -->
  <button id="backToTop" title="Back to top">⬆</button>

  <script>
    console.log("✅ test.js is running");

    document.addEventListener("DOMContentLoaded", function () {
      console.log("✅ DOM loaded");

      // Hamburger toggle
      const toggleBtn = document.getElementById("menuToggle");
      const navMenu = document.querySelector(".nav-menu");
      if (toggleBtn && navMenu) {
        toggleBtn.addEventListener("click", () => {
          navMenu.classList.toggle("active");
          console.log("✅ Hamburger toggled");
        });
      }

      // Dropdown toggle
      document.querySelectorAll(".dropdown-toggle").forEach(button => {
        button.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          const dropdown = this.closest(".dropdown");
          dropdown.classList.toggle("open");
        });
      });

      document.addEventListener("click", e => {
        if (!e.target.closest(".dropdown")) {
          document.querySelectorAll(".dropdown.open").forEach(dd => dd.classList.remove("open"));
        }
      });

      // Back to top
      const backToTopBtn = document.getElementById("backToTop");
      if (backToTopBtn) {
        window.addEventListener("scroll", () => {
          backToTopBtn.style.display = window.scrollY > 300 ? "block" : "none";
        });
        backToTopBtn.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      // Cookie consent
      const popup = document.getElementById("cookie-consent");
      const acceptAllBtn = document.getElementById("accept-all");
      const acceptSelectedBtn = document.getElementById("accept-selected");
      const analytics = document.getElementById("analytics");
      const marketing = document.getElementById("marketing");

      function applyConsent(c) {
        console.log("✅ Consent applied:", c);
      }

      function savePreferences(a, m) {
        const consent = { essential: true, analytics: a, marketing: m };
        localStorage.setItem("cookieConsent", JSON.stringify(consent));
        popup.style.display = "none";
        applyConsent(consent);
      }

      if (popup && acceptAllBtn && acceptSelectedBtn) {
        if (!localStorage.getItem("cookieConsent")) popup.style.display = "block";

        acceptAllBtn.onclick = () => savePreferences(true, true);
        acceptSelectedBtn.onclick = () => savePreferences(analytics.checked, marketing.checked);

        const stored = localStorage.getItem("cookieConsent");
        if (stored) {
          try {
            applyConsent(JSON.parse(stored));
          } catch {
            localStorage.removeItem("cookieConsent");
            popup.style.display = "block";
          }
        }
      }
    });
  </script>
</body>
</html>
