<!DOCTYPE html>
<html lang="en">
   <head>
           
      
      <style>

* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
	font-family: 'Nunito', sans-serif;
}
:root {
	--yellow: #eab308;
	--gold: #fcd34d;
	--dark-green: #1a3329;
	--bg-light: #fff4cc;
	--hover-yellow: #facc15;
	--orange: #ea580c;
	--setup-bg: #ffffff;
	--shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
}
.wrapper {
	display: flex;
	flex-direction: column;
	min-height: 100vh;
	background-color: var(--yellow);
}
.top-banner {
	height: 100px;
	padding: 1rem 2rem;
	display: flex;
	justify-content: space-between;
	align-items: center;
	background-color: var(--yellow);
	flex-shrink: 0;
}
.logo-img {
	height: 40px;
	width: auto;
	display: inline-block;
	vertical-align: middle;
}
.top-banner .logo {
	display: flex;
	align-items: center;
	gap: 0.5rem;
	font-size: 2rem;
	font-weight: 800;
	color: var(--dark-green);
	text-decoration: none;
}
.user-circle {
	background-color: var(--dark-green);
	color: white;
	border-radius: 50%;
	width: 36px;
	height: 36px;
	display: flex;
	align-items: center;
	justify-content: center;
	cursor: pointer;
	font-weight: bold;
	position: relative;
}
.layout {
	display: flex;
	flex: 1;
	height: 100%;
}
.sidebar {
	background-color: var(--dark-green);
	color: white;
	width: 220px;
	padding: 1.5rem 1rem;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
	border-top-left-radius: 1.5rem;
	border-bottom-left-radius: 1.5rem;
	margin-left: 2rem;
}
.copyright {
	text-align: center;
	font-size: 0.8rem;
	color: var(--yellow);
	padding-top: 1rem;
}
.main-content {
	flex: 1;
	background-color: var(--bg-light);
	padding: 2rem;
	display: flex;
	flex-direction: column;
}
.main-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 2rem;
}
.main-header h1 {
	font-size: 2rem;
	color: var(--dark-green);
}
.dashboard-image {
	width: 100%;
	max-height: 300px;
	object-fit: cover;
	border-radius: 1rem;
	margin-bottom: 2rem;
}
.footer-fill {
	height: 50px;
	background-color: var(--yellow);
}

</style>
   </head>
   <body>
      <div class="wrapper">
      <div class="top-banner">
         <div class="logo">
            <a href="https://www.beezknees.co.uk" class="logo">
            <img src="../../images/Beezknees-Logo-Inverted.png" alt="HiveTag Logo" class="logo-img">HiveTag
            </a>
         </div>
         <div class="user-info">
            <span></span>
            <div class="user-circle">CC</div>
         </div>
        
      </div>
      <div class="layout">
      <aside class="sidebar">
         <div>
            
         </div>
         <div class="copyright">
            © 2023 BeezKnees<br/>All rights reserved.
         </div>
      </aside>
      <main class="main-content">
        
        <img src="../../images/beautiful-bee-farm.jpg" alt="Banner" class="dashboard-image" />
         <div class="main-header">
         <p>THIS IS THE MAIN CONTENT WHICH MUST HAVE A WHITE BACKGROUND</p>
         </div>
         
      </main>
      </div>
      <div class="footer-fill"></div>
      <script type="module" src="../js/script.js"></script>
      
   </body>
</html>
