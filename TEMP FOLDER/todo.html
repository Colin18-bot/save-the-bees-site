<!DOCTYPE html>
<html lang="en">
   <head>
     
   </head>
   <body>
      <div class="wrapper">
      <div class="top-banner">
         <div class="logo">
            <a href="https://www.beezknees.co.uk" class="logo">
            <img src="../../images/Beezknees-Logo-Inverted.png" alt="HiveTag Logo" class="logo-img">HiveTag
            </a>
         </div>
         <div class="user-info">
            <span>Members Area</span>
            <div class="user-circle">CC</div>
         </div>
         <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
         <span class="bar"></span>
         <span class="bar"></span>
         <span class="bar"></span>
         </button>
      </div>
      <div class="layout">
         <aside class="sidebar">
            <div>
              
            </div>
            <div class="copyright">
               © 2023 BeezKnees<br/>All rights reserved.
            </div>
         </aside>
         <!-- Main Content -->
         <main class="main-content">
            <!-- Page Title & Button -->
            <div class="main-header">
               <h1>To-do List</h1>
            </div>
            <img src="../../images/beautiful-bee-farm.jpg" alt="Banner" class="dashboard-image" />
            <div class="task-container full-width-box">
               <h2>Add a New Task</h2>
               <div class="task-buttons">
                  <button onclick="selectTask('Feed Bees')">Feed Bees</button>
                  <button onclick="selectTask('Varroa Assessment')">Varroa Assessment</button>
                  <button onclick="selectTask('Weekly Inspection')">Weekly Inspection</button>
                  <button onclick="selectTask('Requeen')">Requeen</button>
                  <button onclick="selectTask('Treatment')">Treatment</button>
                  <button onclick="selectTask('Harvest Honey')">Harvest Honey</button>
                  <button onclick="selectTask('Buy Equipment')">Buy Equipment</button>
                  <button onclick="selectTask('Winter Preparation')">Winter Preparation</button>
                  <button onclick="selectTask('Other')">Other</button>
               </div>
               <form id="task-form" class="task-form hidden">
                  <div class="form-header" id="selected-task-label">Selected Task</div>
                  <div class="form-grid">
                     <div>
                        <label for="due-date">Due Date</label>
                        <input type="date" id="due-date" required>
                     </div>
                     <div>
                        <label for="apiary">Apiary</label>
                        <select id="apiary" required>
                           <option value="">Select</option>
                           <option value="Apiary 1">Apiary 1</option>
                           <option value="Apiary 2">Apiary 2</option>
                        </select>
                     </div>
                     <div>
                        <label for="hive">Hive</label>
                        <select id="hive" required>
                           <option value="All">All Hives</option>
                           <option value="Hive A">Hive A</option>
                           <option value="Hive B">Hive B</option>
                        </select>
                     </div>
                     <div>
                        <label for="status">Status</label>
                        <select id="status">
                           <option value="Pending">Pending</option>
                           <option value="Complete">Complete</option>
                        </select>
                     </div>
                  </div>
                  <div class="form-notes">
                     <label for="notes">Notes</label>
                     <textarea id="notes" rows="3"></textarea>
                  </div>
                  <div class="form-buttons">
                     <button type="submit" class="btn-save">Save Task</button>
                     <button type="reset" class="btn-cancel" onclick="resetForm()">Cancel</button>
                  </div>
               </form>
               <div class="task-list" id="task-list"></div>
               <div class="calendar-link">
                  📅 <a href="calendar.html">View tasks in calendar</a>
               </div>
            </div>
         </main>
      </div>
      <div class="footer-fill"></div>
      <script type="module" src="../js/authCheck.js"></script>
      <script type="module" src="../js/script.js"></script>
           
   </body>
</html>
