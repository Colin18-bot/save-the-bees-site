<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Calendar | HiveTag Member Area</title>
      <!-- Description (optional but good practice) -->
      <meta name="description" content="View upcoming hive inspections, to-do tasks, and seasonal beekeeping events in your secure HiveTag calendar." />
      <!-- Theme color (browser bar on mobile) -->
      <meta name="theme-color" content="#222222" />
      <!-- Prevent indexing by search engines if this page is private -->
      <meta name="robots" content="noindex, nofollow" />
      <!-- Optional: Disable automatic phone number detection on iOS -->
      <meta name="format-detection" content="telephone=no" />
      <!-- No caching (optional) -->
      <meta http-equiv="Cache-Control" content="no-store" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <!-- Favicon -->
      <link rel="icon" href="../../images/favicon.ico" type="image/x-icon" />
      <!-- 16x16 and 32x32 favicons for browser tabs -->
      <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png" />
      <!-- Apple touch icon for iOS home screen -->
      <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
      <!-- Android home screen icons -->
      <link rel="icon" type="image/png" sizes="192x192" href="../../android-chrome-192x192.png" />
      <link rel="icon" type="image/png" sizes="512x512" href="../../android-chrome-512x512.png" />
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="../css/main.css" />

   </head>
   <body>
      <div class="wrapper">
      <div class="top-banner">
         <div class="logo">
            <a href="https://www.beezknees.co.uk" class="logo">
            <img src="../../images/Beezknees-Logo-Inverted.png" alt="HiveTag Logo" class="logo-img">HiveTag
            </a>
         </div>
         <div class="user-info">
            <span>Members Area</span>
            <div class="user-circle">CC</div>
         </div>
         <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
         <span class="bar"></span>
         <span class="bar"></span>
         <span class="bar"></span>
         </button>
      </div>
      <div class="layout">
         <aside class="sidebar">
            <div>
               <a href="dashboard.html" class="nav-link">Dashboard</a>
               <a href="apiaries.html" class="nav-link">Apiaries</a>
               <a href="hives.html" class="nav-link">Hives</a>
               <a href="inspections.html" class="nav-link">Inspections</a>
               <a href="todo.html" class="nav-link">To-do List</a>
               <a href="hive-logbook.html" class="nav-link">Hive Logbook</a>
               <a href="calendar.html" class="nav-link active">Calendar</a>
               <a href="weather.html" class="nav-link">Weather</a>
               <a href="settings.html" class="nav-link">Settings</a>
               <a href="groups.html" class="nav-link">Groups</a>
               <a href="archives.html" class="nav-link">Archives</a>
               <a href="help.html" class="nav-link">Help</a>
               <a href="#" id="logout" class="logout-btn">Log Out</a>
            </div>
            <div class="copyright">
               © 2023 BeezKnees<br/>All rights reserved.
            </div>
         </aside>
         <main class="main-content">
            <div class="main-header">
               <h1>Calendar</h1>
            </div>
            <img src="../../images/beautiful-bee-farm.jpg" alt="Calendar Image" class="dashboard-image">
            <!-- Filter Controls -->
            <div class="section">
               <h3>Filter by Apiary, Hive, and Date</h3>
               <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
                  <select class="calendar-filter" id="apiarySelect">
                     <option value="all">All Apiaries</option>
                     <option value="Sunny Fields">Sunny Fields</option>
                     <option value="Hilltop Apiary">Hilltop Apiary</option>
                  </select>
                  <select class="calendar-filter" id="hiveSelect">
                     <option value="all">All Hives</option>
                     <option value="Hive 1">Hive 1</option>
                     <option value="Hive 2">Hive 2</option>
                     <option value="Hive 3">Hive 3</option>
                  </select>
                  <select class="calendar-filter" id="monthSelect">
                     <option value="0">January</option>
                     <option value="1">February</option>
                     <option value="2">March</option>
                     <option value="3">April</option>
                     <option value="4">May</option>
                     <option value="5">June</option>
                     <option value="6" selected>July</option>
                     <option value="7">August</option>
                     <option value="8">September</option>
                     <option value="9">October</option>
                     <option value="10">November</option>
                     <option value="11">December</option>
                  </select>
                  <select class="calendar-filter" id="yearSelect">
                     <option value="2024">2024</option>
                     <option value="2025" selected>2025</option>
                     <option value="2026">2026</option>
                  </select>
               </div>
            </div>
            <!-- Calendar Grid -->

<div class="section">
  <h3>Monthly View</h3>
  <h4 id="calendarMonthYear" style="margin-top: -1rem; margin-bottom: 1rem;"></h4>

  <div id="calendarGrid" style="
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1rem;
    background-color: white;
    padding: 1rem;
    border-radius: 1rem;
    box-shadow: var(--shadow);
  ">
    <!-- Weekday headers -->
    <div><strong>Sun</strong></div>
    <div><strong>Mon</strong></div>
    <div><strong>Tue</strong></div>
    <div><strong>Wed</strong></div>
    <div><strong>Thu</strong></div>
    <div><strong>Fri</strong></div>
    <div><strong>Sat</strong></div>
  </div>
</div>
      </main>
      </div>
      <div class="footer-fill"></div>
      <script type="module" src="../js/authCheck.js"></script>
      <script type="module" src="../js/script.js"></script>
   </body>
</html>
