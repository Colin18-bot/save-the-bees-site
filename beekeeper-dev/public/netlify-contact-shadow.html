<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify contact shadow form</title>
  </head>
  <body>
    <!-- Hidden snapshot form just for Netlify -->
    <form
      name="member-contact"
      method="POST"
      netlify
      data-netlify="true"
      netlify-honeypot="bot-field"
      action="/contact/sent"
      hidden
    >
      <input type="hidden" name="form-name" value="member-contact" />

      <p>
        <label>
          Your name
          <input type="text" name="name" />
        </label>
      </p>

      <p>
        <label>
          Your email
          <input type="email" name="email" />
        </label>
      </p>

      <p>
        <label>
          Subject
          <input type="text" name="subject" />
        </label>
      </p>

      <p>
        <label>
          Message
          <textarea name="message"></textarea>
        </label>
      </p>

      <!-- Honeypot field -->
      <p style="display:none">
        <label>
          Don’t fill this out if you’re human:
          <input name="bot-field" />
        </label>
      </p>
    </form>
  </body>
</html>
