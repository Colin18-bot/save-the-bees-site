    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BeezKnees",
        "url": "https://www.beezknees.co.uk",
        "description": "BeezKnees is a smart, modern beekeeping platform to manage your apiaries, hives, inspections, weather tracking, and more.",
        "publisher": {
          "@type": "Organization",
          "name": "BeezKnees",
          "logo": {
            "@type": "ImageObject",
            "url": "https://beezknees.co.uk/assets/android-chrome-512x512.png"
          }
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "BeezKnees Pro",
        "image": [
          "https://beezknees.co.uk/assets/beekeeper-pro.jpg"

        "url": "https://beezknees.co.uk/pricing"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

          {
            "@type": "Question",
            "name": "What is BeezKnees?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "BeezKnees is a smart beekeeping platform for managing hives, inspections, and apiaries."
            }

          {
            "@type": "Question",
            "name": "Is BeezKnees free to use?",

              "text": "Yes! There's a free tier, and premium features are available under BeezKnees Pro."
            }
          }
        ]

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"

  <body>
    <!-- Netlify Forms detection (hidden) -->
    <form
      name="member-contact"
      method="POST"
      netlify
      data-netlify="true"
      netlify-honeypot="bot-field"
      action="/contact/sent"
      hidden
    >
      <input type="hidden" name="form-name" value="member-contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>

    <!-- Keep absolute path here; Vite rewrites this on build -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
