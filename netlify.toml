[build]
  base = "beekeeper-dev"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Use Node 20 on Netlify
  NODE_VERSION = "20"

  # Work around Rollup's optional native binary issue on Netlify
  ROLLUP_SKIP_NODEJS_NATIVE = "true"

[functions]
  # This can stay as-is if you want to keep the existing Netlify functions
  directory = "netlify/functions"
