<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Hive – HiveTag</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .form-card button {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="nav-left">
      <a href="dashboard.html" class="logo">HiveTag</a>
    </div>
    <nav class="nav-right">
      <ul class="nav-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="apiaries.html">Apiaries</a></li>
        <li><a href="hives.html">Hives</a></li>
        <li><a href="inspections.html">Inspections</a></li>
        <li><a href="todo.html">To-Do</a></li>
        <li><a href="hive-logbook.html">Hive Logbook</a></li>
        <li><a href="weather.html">Weather</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li class="profile-dropdown">
          <button class="profile-icon" id="profile-icon" type="button">
            <img src="https://ui-avatars.com/api/?name=User" alt="Profile" class="avatar">
            <span id="profile-name">Logged in</span>
            <i class="fas fa-caret-down"></i>
          </button>
          <ul class="dropdown-menu" id="dropdown-menu">
            <li><strong id="dropdown-email">user@example.com</strong></li>
            <li><a href="settings.html">Settings</a></li>
            <li><a href="groups.html">Groups</a></li>
            <li><button id="logout-button">Log out</button></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main class="page">
    <h2 id="form-title">Add New Hive</h2>
    <form class="form-card" action="hives.html" method="POST">
      <label for="apiary">Apiary</label>
      <select id="apiary" name="apiary" required>
        <option value="">Select Apiary</option>
        <option value="Orchard Apiary">Orchard Apiary</option>
        <option value="Garden Apiary">Garden Apiary</option>
      </select>

      <label for="hive-id">Hive ID / Number</label>
      <input type="text" id="hive-id" name="hive-id" placeholder="e.g. Hive 3B" required />

      <label for="hive-type">Hive Type</label>
      <select id="hive-type" name="hive-type">
        <option value="National">National</option>
        <option value="Langstroth">Langstroth</option>
        <option value="WBC">WBC</option>
        <option value="Top Bar">Top Bar</option>
        <option value="Other">Other</option>
      </select>

      <label for="status">Hive Status</label>
      <select id="status" name="status">
        <option value="Active">Active</option>
        <option value="Split">Split</option>
        <option value="Nuc">Nuc</option>
        <option value="Queenless">Queenless</option>
        <option value="Archived">Archived</option>
      </select>

      <label for="installed">Installation Date</label>
      <input type="date" id="installed" name="installed" />

      <label for="notes">Hive Notes</label>
      <textarea id="notes" name="notes" rows="3" placeholder="e.g. Swarm installed 14 May. Foundation added."></textarea>

      <button id="submit-btn" type="submit" class="btn-primary">Save Hive</button>
    </form>
  </main>

  <script>
    // Simulate fetching existing data if editing
    const urlParams = new URLSearchParams(window.location.search);
    const hiveIdParam = urlParams.get('hive');

    if (hiveIdParam) {
      document.getElementById('form-title').textContent = 'Edit Hive';
      document.getElementById('submit-btn').textContent = 'Update Hive';

      // Dummy data – extend this to real storage or Supabase later
      const hiveData = {
        "HiveA": {
          apiary: "Orchard Apiary",
          hiveId: "Hive A",
          hiveType: "National",
          status: "Active",
          installed: "2024-05-15",
          notes: "Marked queen added May 15. Brood pattern strong."
        }
      };

      const data = hiveData[hiveIdParam];
      if (data) {
        document.getElementById('apiary').value = data.apiary;
        document.getElementById('hive-id').value = data.hiveId;
        document.getElementById('hive-type').value = data.hiveType;
        document.getElementById('status').value = data.status;
        document.getElementById('installed').value = data.installed;
        document.getElementById('notes').value = data.notes;
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
