  <main class="page">
    <h2>Create New Group</h2>
    <form class="form-card" action="groups.html" method="POST">
      <label for="group-name">Group Name</label>
      <input type="text" id="group-name" name="group-name" required />

      <label for="group-description">Group Description</label>
      <textarea id="group-description" name="group-description" rows="3" placeholder="Optional group purpose or notes..."></textarea>

      <div class="invite-section">
        <label for="member-email">Invite Member</label>
        <input type="email" id="member-email" name="member-email" placeholder="Enter member email or username" required />

        <label for="member-role">Set Role</label>
        <select id="member-role" name="member-role">
          <option>View Only</option>
          <option>Edit Access</option>
          <option>Admin</option>
        </select>
      </div>

      <!-- Placeholder for future multiple invite feature -->
      <!-- <button type="button" class="btn-secondary">+ Add Another Member</button> -->

      <button type="submit" class="btn-primary">Create Group</button>
    </form>
  </main>
