<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Weather Forecast | HiveTag Member Area</title>
      <!-- Description (optional but good practice) -->
      <meta name="description" content="Check the 5-day weather forecast for your apiaries to plan inspections, treatments, and hive visits effectively." />
      <!-- Theme color (browser bar on mobile) -->
      <meta name="theme-color" content="#222222" />
      <!-- Prevent indexing by search engines if this page is private -->
      <meta name="robots" content="noindex, nofollow" />
      <!-- Optional: Disable automatic phone number detection on iOS -->
      <meta name="format-detection" content="telephone=no" />
      <!-- No caching (optional) -->
      <meta http-equiv="Cache-Control" content="no-store" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <!-- Favicon -->
      <link rel="icon" href="../../images/favicon.ico" type="image/x-icon" />
      <!-- 16x16 and 32x32 favicons for browser tabs -->
      <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png" />
      <!-- Apple touch icon for iOS home screen -->
      <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
      <!-- Android home screen icons -->
      <link rel="icon" type="image/png" sizes="192x192" href="../../android-chrome-192x192.png" />
      <link rel="icon" type="image/png" sizes="512x512" href="../../android-chrome-512x512.png" />
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="../css/main.css" />
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

   <body>
      <div class="wrapper">
      <div class="top-banner">
         <div class="logo">
            <a href="https://www.beezknees.co.uk" class="logo">
            <img src="../../images/Beezknees-Logo-Inverted.png" alt="HiveTag Logo" class="logo-img">HiveTag
            </a>
         </div>
         <div class="user-info">
            <span>Members Area</span>
            <div class="user-circle">CC</div>
         </div>
         <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
         <span class="bar"></span>
         <span class="bar"></span>
         <span class="bar"></span>
         </button>
      </div>
      <div class="layout">
         <aside class="sidebar">
            <div>
               <a href="dashboard.html" class="nav-link">Dashboard</a>
               <a href="apiaries.html" class="nav-link">Apiaries</a>
               <a href="hives.html" class="nav-link">Hives</a>
               <a href="inspections.html" class="nav-link">Inspections</a>
               <a href="todo.html" class="nav-link">To-do List</a>
               <a href="hive-logbook.html" class="nav-link">Hive Logbook</a>
               <a href="calendar.html" class="nav-link">Calendar</a>
               <a href="weather.html" class="nav-link active">Weather</a>
               <a href="settings.html" class="nav-link">Settings</a>
               <a href="groups.html" class="nav-link">Groups</a>
               <a href="archives.html" class="nav-link">Archives</a>
               <a href="help.html" class="nav-link">Help</a>
               <a href="logout.html" class="logout-btn">Log Out</a>
            </div>
            <div class="copyright">
               © 2023 BeezKnees<br/>All rights reserved.
            </div>
         </aside>
         <main class="main-content">
            <div class="main-header">
               <h1>3-Day Weather Forecast</h1>
            </div>
            <img src="../../images/beautiful-bee-farm.jpg" alt="Banner" class="dashboard-image" />
            <div class="main-container">
               <p>Select an apiary to view the forecast and location:</p>
               <div class="weather-select">
                  <label for="apiarySelect">Apiary:</label>
                  <select id="apiarySelect">
                     <option value="51.402,-3.280,Home Apiary">Home Apiary</option>
                     <option value="51.456,-3.199,Mountain Apiary">Mountain Apiary</option>
                     <option value="51.476,-3.180,City Apiary">City Apiary</option>
                  </select>
               </div>
               <h2 id="apiaryNameHeading">Weather for: Home Apiary</h2>
               <div id="map"></div>
               <div class="weather-forecast" id="weatherForecast"></div>
            </div>
         </main>
      </div>
      <div class="footer-fill"></div>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
      <script src="../js/script.js"></script>
      <script src="../js/weather.js"></script>
