<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Supabase Test</title>
</head>
<body>
  <h1>Supabase Connection Test</h1>
  <p id="status">Checking connection...</p>

  <!-- Supabase client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script>
    const SUPABASE_URL = 'https://uihngfpmoasnofyrvpmw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';

    // ✅ Rename to avoid conflict with global supabase library
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    client
      .from("nonexistent_table")
      .select("*")
      .then(response => {
        document.getElementById("status").textContent = "✅ Supabase is responding.";
        console.log("Supabase is connected:", response);
      })
      .catch(error => {
        document.getElementById("status").textContent = "❌ Connection failed.";
        console.error("Supabase error:", error);
      });
  </script>
</body>
</html>
