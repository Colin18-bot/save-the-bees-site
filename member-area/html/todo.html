<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Hives | HiveTag Member Area</title>
      <!-- Description (optional but good practice) -->
      <meta name="description" content="View and manage your hives in each apiary. Inspect, edit, clone, archive, or delete hives directly from your HiveTag dashboard." />
      <!-- Theme color (browser bar on mobile) -->
      <meta name="theme-color" content="#222222" />
      <!-- Prevent indexing by search engines if this page is private -->
      <meta name="robots" content="noindex, nofollow" />
      <!-- Optional: Disable automatic phone number detection on iOS -->
      <meta name="format-detection" content="telephone=no" />
      <!-- No caching (optional) -->
      <meta http-equiv="Cache-Control" content="no-store" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <!-- Favicon -->
      <link rel="icon" href="../../images/favicon.ico" type="image/x-icon" />
      <!-- 16x16 and 32x32 favicons for browser tabs -->
      <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png" />
      <!-- Apple touch icon for iOS home screen -->
      <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
      <!-- Android home screen icons -->
      <link rel="icon" type="image/png" sizes="192x192" href="../../android-chrome-192x192.png" />
      <link rel="icon" type="image/png" sizes="512x512" href="../../android-chrome-512x512.png" />
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="../css/main.css" />
   </head>
   <body>
      <div class="wrapper">
      <div class="top-banner">
         <div class="logo">
            <a href="https://www.beezknees.co.uk" class="logo">
            <img src="../../images/Beezknees-Logo-Inverted.png" alt="HiveTag Logo" class="logo-img">HiveTag
            </a>
         </div>
         <div class="user-info">
            <span>Members Area</span>
            <div class="user-circle">CC</div>
         </div>
         <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
         <span class="bar"></span>
         <span class="bar"></span>
         <span class="bar"></span>
         </button>
      </div>
      <div class="layout">
         <aside class="sidebar">
            <div>
               <a href="dashboard.html" class="nav-link">Dashboard</a>
               <a href="apiaries.html" class="nav-link">Apiaries</a>
               <a href="hives.html" class="nav-link">Hives</a>
               <a href="inspections.html" class="nav-link">Inspections</a>
               <a href="todo.html" class="nav-link class">To-do List</a>
               <a href="hive-logbook.html" class="nav-link">Hive Logbook</a>
               <a href="calendar.html" class="nav-link">Calendar</a>
               <a href="weather.html" class="nav-link">Weather</a>
               <a href="settings.html" class="nav-link">Settings</a>
               <a href="groups.html" class="nav-link">Groups</a>
               <a href="archives.html" class="nav-link">Archives</a>
               <a href="help.html" class="nav-link">Help</a>
               <a href="#" id="logout" class="logout-btn">Log Out</a>
            </div>
            <div class="copyright">
               © 2023 BeezKnees<br/>All rights reserved.
            </div>
         </aside>
         <!-- Main Content -->
         <main class="main-content">
            <!-- Page Title & Button -->
            <div class="main-header">
               <h1>To-do List</h1>
            </div>
            <img src="../../images/beautiful-bee-farm.jpg" alt="Banner" class="dashboard-image" />
            <div class="task-container full-width-box">
               <h2>Add a New Task</h2>
               <div class="task-buttons">
                  <button onclick="selectTask('Feed Bees')">Feed Bees</button>
                  <button onclick="selectTask('Varroa Assessment')">Varroa Assessment</button>
                  <button onclick="selectTask('Weekly Inspection')">Weekly Inspection</button>
                  <button onclick="selectTask('Requeen')">Requeen</button>
                  <button onclick="selectTask('Treatment')">Treatment</button>
                  <button onclick="selectTask('Harvest Honey')">Harvest Honey</button>
                  <button onclick="selectTask('Buy Equipment')">Buy Equipment</button>
                  <button onclick="selectTask('Winter Preparation')">Winter Preparation</button>
                  <button onclick="selectTask('Other')">Other</button>
               </div>
               <form id="task-form" class="task-form hidden">
                  <div class="form-header" id="selected-task-label">Selected Task</div>
                  <div class="form-grid">
                     <div>
                        <label for="due-date">Due Date</label>
                        <input type="date" id="due-date" required>
                     </div>
                     <div>
                        <label for="apiary">Apiary</label>
                        <select id="apiary" required>
                           <option value="">Select</option>
                           <option value="Apiary 1">Apiary 1</option>
                           <option value="Apiary 2">Apiary 2</option>
                        </select>
                     </div>
                     <div>
                        <label for="hive">Hive</label>
                        <select id="hive" required>
                           <option value="All">All Hives</option>
                           <option value="Hive A">Hive A</option>
                           <option value="Hive B">Hive B</option>
                        </select>
                     </div>
                     <div>
                        <label for="status">Status</label>
                        <select id="status">
                           <option value="Pending">Pending</option>
                           <option value="Complete">Complete</option>
                        </select>
                     </div>
                  </div>
                  <div class="form-notes">
                     <label for="notes">Notes</label>
                     <textarea id="notes" rows="3"></textarea>
                  </div>
                  <div class="form-buttons">
                     <button type="submit" class="btn-save">Save Task</button>
                     <button type="reset" class="btn-cancel" onclick="resetForm()">Cancel</button>
                  </div>
               </form>
               <div class="task-list" id="task-list"></div>
               <div class="calendar-link">
                  📅 <a href="calendar.html">View tasks in calendar</a>
               </div>
            </div>
         </main>
      </div>
      <div class="footer-fill"></div>
      <script src="../js/script.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <script src="../js/supabaseClient.js"></script>
      <script src="../js/authCheck.js"></script>
   </body>
</html>
