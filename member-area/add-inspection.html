<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Inspection – HiveTag</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="main-header">
    <div class="nav-left">
      <a href="dashboard.html" class="logo">HiveTag</a>
    </div>
    <nav class="nav-right">
      <ul class="nav-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="apiaries.html">Apiaries</a></li>
        <li><a href="hives.html">Hives</a></li>
        <li><a href="inspections.html">Inspections</a></li>
        <li><a href="todo.html">To-Do</a></li>
        <li><a href="hive-logbook.html">Hive Logbook</a></li>
        <li><a href="weather.html">Weather</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li class="profile-dropdown">
          <button class="profile-icon" id="profile-icon" type="button">
            <img src="https://ui-avatars.com/api/?name=User" alt="Profile" class="avatar">
            <span id="profile-name">Logged in</span>
            <i class="fas fa-caret-down"></i>
          </button>
          <ul class="dropdown-menu" id="dropdown-menu">
            <li><strong id="dropdown-email">user@example.com</strong></li>
            <li><a href="settings.html">Settings</a></li>
            <li><a href="groups.html">Groups</a></li>
            <li><button id="logout-button">Log out</button></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main class="page">
    <h2>New Hive Inspection</h2>
    <form class="form-card" action="inspections.html" method="POST" enctype="multipart/form-data">
      <label for="apiary">Apiary</label>
      <select id="apiary" name="apiary" required>
        <option value="">Select an Apiary</option>
        <option>Orchard Apiary</option>
        <option>Garden Apiary</option>
      </select>

      <label for="hive">Hive</label>
      <select id="hive" name="hive" required>
        <option value="">Select a Hive</option>
        <option>Hive A</option>
        <option>Hive B</option>
      </select>

      <label for="date">Inspection Date</label>
      <input type="datetime-local" id="date" name="date" required />

      <label for="weather">Weather</label>
      <input type="text" id="weather" name="weather" placeholder="e.g. Sunny, 18°C, Light breeze" />

      <label for="health">Hive Health</label>
      <select id="health" name="health">
        <option>Healthy</option>
        <option>Queenless</option>
        <option>Swarming Signs</option>
        <option>Low Brood</option>
        <option>Unusual Behaviour</option>
      </select>

      <label for="feed">Feeding</label>
      <input type="text" id="feed" name="feed" placeholder="e.g. Syrup, 2L" />

      <label for="treatment">Treatment</label>
      <input type="text" id="treatment" name="treatment" placeholder="e.g. Apiguard, start day 1" />

      <label for="harvest">Harvest</label>
      <input type="text" id="harvest" name="harvest" placeholder="e.g. 8kg capped honey removed" />

      <label for="queen-status">Queen Status</label>
      <select id="queen-status" name="queen-status">
        <option>Seen and marked</option>
        <option>Seen – unmarked</option>
        <option>Not seen – eggs present</option>
        <option>Not seen – no eggs</option>
      </select>

      <label for="notes">Inspection Notes</label>
      <textarea id="notes" name="notes" rows="4" placeholder="Observations, concerns, next steps..."></textarea>

      <label for="photo">Photo (optional)</label>
      <input type="file" id="photo" name="photo" accept="image/*" />

      <button type="submit" class="btn-primary">Save Inspection</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
