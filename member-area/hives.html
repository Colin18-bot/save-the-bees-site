    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .btn-action {
      display: inline-block;
      padding: 0.5rem 1rem;
      margin: 0 0.2rem;
      border: none;
      border-radius: 4px;
      color: #fff;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      min-width: 90px;
    }

    .btn-inspect { background-color: #17a2b8; }
    .btn-edit { background-color: #007bff; }
    .btn-secondary { background-color: #6c757d; }
    .btn-warning { background-color: #fd7e14; }
    .btn-danger { background-color: #dc3545; }
    .btn-action:hover { opacity: 0.85; }

    .apiary-filter {
      margin-bottom: 1.5rem;
    }
  </style>

    <div class="nav-left">
      <a href="dashboard.html" class="logo">HiveTag</a>

        <li><a href="calendar.html">Calendar</a></li>
        <li class="profile-dropdown">
          <button class="profile-icon" id="profile-icon" type="button">
            <img src="https://ui-avatars.com/api/?name=User" alt="Profile" class="avatar">
            <span id="profile-name">Logged in</span>
            <i class="fas fa-caret-down"></i>
          </button>
          <ul class="dropdown-menu" id="dropdown-menu">
            <li><strong id="dropdown-email">user@example.com</strong></li>
            <li><a href="settings.html">Settings</a></li>
            <li><a href="groups.html">Groups</a></li>
            <li><button id="logout-button">Log out</button></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main class="page">
    <div class="top-bar">
      <h2>Hives</h2>
      <a href="add-hive.html" class="btn-primary">+ Add Hive</a>
    </div>

    <div class="apiary-filter">
      <label for="apiarySelect">View by Apiary:</label>
      <select id="apiarySelect" onchange="filterApiary()">
        <option value="Home Apiary">Home Apiary</option>
        <option value="Orchard Apiary">Orchard Apiary</option>
        <option value="Garden Apiary">Garden Apiary</option>
        <option value="All">All Apiaries</option>
      </select>
    </div>

    <h3 id="apiaryTitle">Hives at Home Apiary</h3>

    <table class="data-table">
      <thead>
        <tr>
          <th>Hive ID</th>
          <th>Status</th>
          <th>Queen</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr data-apiary="Home Apiary">
          <td>Hive A</td>
          <td>Active</td>
          <td>Marked (Blue)</td>
          <td>
            <button class="btn-action btn-inspect">Inspect</button>
            <a href="add-hive.html?hive=HiveA" class="btn-action btn-edit">Edit</a>
            <button class="btn-action btn-secondary">Clone</button>
            <button class="btn-action btn-warning" onclick="confirmArchive('Hive A')">Archive</button>
            <button class="btn-action btn-danger" onclick="confirmDelete('Hive A')">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/scripts.js"></script>
  <script>
    function confirmDelete(hiveId) {
      if (confirm(`Are you sure you want to delete ${hiveId}?`)) {
        alert(`${hiveId} deleted (placeholder action).`);
      }
    }

    function confirmArchive(hiveId) {
      if (confirm(`Are you sure you want to archive ${hiveId}?`)) {
        alert(`${hiveId} archived (placeholder action).`);
      }
    }

    function filterApiary() {
      const selected = document.getElementById('apiarySelect').value;
      const rows = document.querySelectorAll('tbody tr');
      const title = document.getElementById('apiaryTitle');
      title.textContent = selected === 'All' ? 'All Hives' : `Hives at ${selected}`;
      rows.forEach(row => {
        const apiary = row.getAttribute('data-apiary');
        row.style.display = selected === 'All' || apiary === selected ? '' : 'none';
      });
    }
  </script>
