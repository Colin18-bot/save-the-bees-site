  <main class="page">
    <h2>To-Do Tasks</h2>
    <p style="text-align: center;">
      <a href="calendar.html" class="btn-secondary">📅 View Calendar</a>
    </p>

    <!-- Task Type Tabs -->
    <div class="tab-buttons">
      <button onclick="showTaskForm('feed')">Feed Bees</button>
      <button onclick="showTaskForm('varroa')">Varroa Assessment</button>
      <button onclick="showTaskForm('inspection')">Weekly Inspection</button>
      <button onclick="showTaskForm('requeen')">Requeen</button>
      <button onclick="showTaskForm('treatment')">Treatment</button>
      <button onclick="showTaskForm('harvest')">Harvest Honey</button>
      <button onclick="showTaskForm('buy')">Buy Equipment</button>
      <button onclick="showTaskForm('winter')">Winter Preparation</button>
      <button onclick="showTaskForm('other')">Other</button>
    </div>

    <!-- Task Form Template -->
    <template id="task-form-template">
      <form class="form-card todo-form" style="display:none;">
        <h3 class="task-title"></h3>

        <label>Apiary</label>
        <select name="apiary" required>
          <option>Select Apiary</option>
          <option>Orchard Apiary</option>
        </select>

        <label>Hive</label>
        <select name="hive">
          <option>All Hives</option>
          <option>Hive A</option>
        </select>

        <label>Due Date</label>
        <input type="date" name="due-date" required>

        <label>Notes</label>
        <textarea name="notes" rows="3"></textarea>

        <label>Status</label>
        <select name="status">
          <option>Pending</option>
          <option>Complete</option>
        </select>

        <button type="submit" class="btn-primary">Save Task</button>
      </form>
    </template>

    <!-- Form Containers for Each Task -->
    <div id="task-forms"></div>

    <div id="permission-message" style="display:none; color: red; text-align: center; margin-top: 1rem;">
      You do not have permission to edit this task.
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/scripts.js"></script>
  <script>
    const tasks = [
      { id: 'feed', label: 'Feed Bees' },
      { id: 'varroa', label: 'Varroa Assessment' },
      { id: 'inspection', label: 'Weekly Inspection' },
      { id: 'requeen', label: 'Requeen' },
      { id: 'treatment', label: 'Treatment' },
      { id: 'harvest', label: 'Harvest Honey' },
      { id: 'buy', label: 'Buy Equipment' },
      { id: 'winter', label: 'Winter Preparation' },
      { id: 'other', label: 'Other' }
    ];

    const container = document.getElementById("task-forms");
    const template = document.getElementById("task-form-template").content;

    tasks.forEach(task => {
      const form = template.cloneNode(true);
      form.querySelector("form").id = task.id;
      form.querySelector(".task-title").textContent = task.label;
      container.appendChild(form);
    });

    function showTaskForm(id) {
      document.querySelectorAll(".todo-form").forEach(f => f.style.display = "none");
      document.querySelectorAll(".tab-buttons button").forEach(btn => btn.classList.remove("active"));
      document.getElementById(id).style.display = "block";
      document.querySelector(`.tab-buttons button[onclick*="${id}"]`).classList.add("active");
    }
  </script>
