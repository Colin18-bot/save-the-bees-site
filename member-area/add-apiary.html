<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add New Apiary – HiveTag</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
  <body>
  <header class="main-header">
    <div class="nav-left">
      <a href="dashboard.html" class="logo">HiveTag</a>
    </div>
    <nav class="nav-right">
      <ul class="nav-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="apiaries.html">Apiaries</a></li>
        <li><a href="hives.html">Hives</a></li>
        <li><a href="inspections.html">Inspections</a></li>
        <li><a href="todo.html">To-Do</a></li>
        <li><a href="hive-logbook.html">Hive Logbook</a></li>
        <li><a href="weather.html">Weather</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li class="profile-dropdown">
          <button class="profile-icon" id="profile-icon" type="button">
            <img src="https://ui-avatars.com/api/?name=User" alt="Profile" class="avatar">
            <span id="profile-name">Logged in</span>
            <i class="fas fa-caret-down"></i>
          </button>
          <ul class="dropdown-menu" id="dropdown-menu">
            <li><strong id="dropdown-email">user@example.com</strong></li>
            <li><a href="settings.html">Settings</a></li>
            <li><a href="groups.html">Groups</a></li>
            <li><button id="logout-button">Log out</button></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main class="page">
    <h2>Add New Apiary</h2>
    <form class="form-card" action="#" method="POST">
      <label for="apiary-name">Apiary Name</label>
      <input type="text" id="apiary-name" name="apiary-name" placeholder="e.g. Orchard Apiary" required />

      <label for="location">Location Notes</label>
      <input type="text" id="location" name="location" placeholder="e.g. Behind the barn near orchard" />

      <label for="postcode">Postcode</label>
      <input type="text" id="postcode" name="postcode" placeholder="e.g. CF61 1XY" required />

      <label for="latitude">Latitude</label>
      <input type="text" id="latitude" name="latitude" placeholder="Auto-fill or drag map pin" />

      <label for="longitude">Longitude</label>
      <input type="text" id="longitude" name="longitude" placeholder="Auto-fill or drag map pin" />

      <label for="description">Description / Notes</label>
      <textarea id="description" name="description" rows="3" placeholder="Any additional info about this apiary..."></textarea>

      <div class="weather-map-placeholder">
        <strong>[Map Placeholder]</strong><br/>
        Optionally integrate Leaflet to select location by pin
      </div>

      <button type="submit" class="btn-primary">Save Apiary</button>
    </form>
  </main>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/scripts.js"></script> 
</body>

 </html>
