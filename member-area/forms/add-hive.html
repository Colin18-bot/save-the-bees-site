      <main class="main-content">
         <div class="main-header">
            <h1>Add Your Hives</h1>
         </div>
         <img src="../../images/beautiful-bee-farm.jpg" alt="Banner" class="dashboard-image" />
         <div class="page-container">
            <form name="add-hive-form" method="POST" netlify class="form-container" action="/member-area/hives.html">
               <!-- Link to Apiary -->
               <label for="apiarySelect">Select Apiary</label>
               <select id="apiarySelect" name="apiary" required>
                  <option value="">Select Apiary</option>
                  <!-- These should be dynamically populated -->
                  <option value="apiary-1">Apiary 1</option>
                  <option value="apiary-2">Apiary 2</option>
               </select>
               <!-- Hive ID -->
               <label for="hiveId">Hive ID</label>
               <input type="text" id="hiveId" name="hiveId" required placeholder="e.g. Hive A, 2024-N1">
               <!-- Hive Type -->
               <label for="hiveType">Hive Type</label>
               <select id="hiveType" name="hiveType" required>
                  <option value="">Select...</option>
                  <option value="National">National</option>
                  <option value="WBC">WBC</option>
                  <option value="Langstroth">Langstroth</option>
                  <option value="Top Bar">Top Bar</option>
                  <option value="Flow Hive">Flow Hive</option>
                  <option value="other">Other</option>
               </select>
               <div id="hiveTypeOtherWrapper" class="hidden">
                  <label for="hiveTypeOther">Specify Hive Type</label>
                  <input type="text" id="hiveTypeOther" name="hiveTypeOther" placeholder="Specify hive type">
               </div>
               <!-- Hive Status -->
               <label for="hiveStatus">Hive Status</label>
               <select id="hiveStatus" name="hiveStatus" required>
                  <option value="">Select...</option>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                  <option value="Archived">Archived</option>
               </select>
               <!-- Date Established -->
               <label for="hiveStartDate">Date Established</label>
               <input type="date" id="hiveStartDate" name="hiveStartDate">
               <!-- Notes -->
               <label for="hiveNotes">Notes</label>
               <textarea id="hiveNotes" name="hiveNotes" rows="3" placeholder="Any special observations or details..."></textarea>
               <!-- Photo Upload -->
               <label for="hivePhoto">Upload Photo</label>
               <input type="file" name="hivePhoto" id="hivePhoto" accept="image/*">
               <!-- Submit -->
               <div class="button-group">
                  <button type="submit" class="btn-primary">Save Hive</button>
               </div>
            </form>
      </main>
