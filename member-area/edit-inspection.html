  <main class="page">
    <h2>Edit Hive Inspection</h2>
    <form class="form-card" action="inspections.html" method="POST" enctype="multipart/form-data">
      <label for="apiary">Apiary</label>
      <select id="apiary" name="apiary" required>
        <option>Orchard Apiary</option>
        <option selected>Garden Apiary</option>
      </select>

      <label for="hive">Hive</label>
      <select id="hive" name="hive" required>
        <option>Hive A</option>
        <option selected>Hive B</option>
      </select>

      <label for="date">Inspection Date</label>
      <input type="datetime-local" id="date" name="date" value="2025-07-07T14:30" required />

      <label for="weather">Weather</label>
      <input type="text" id="weather" name="weather" value="Overcast, 16°C, slight breeze" />

      <label for="health">Hive Health</label>
      <select id="health" name="health">
        <option>Healthy</option>
        <option selected>Queenless</option>
        <option>Swarming Signs</option>
        <option>Low Brood</option>
        <option>Unusual Behaviour</option>
      </select>

      <label for="feed">Feeding</label>
      <input type="text" id="feed" name="feed" value="2L syrup fed post-inspection" />

      <label for="treatment">Treatment</label>
      <input type="text" id="treatment" name="treatment" value="Oxalic acid dribble applied" />

      <label for="harvest">Harvest</label>
      <input type="text" id="harvest" name="harvest" value="No harvest this time" />

      <label for="queen-status">Queen Status</label>
      <select id="queen-status" name="queen-status">
        <option>Seen and marked</option>
        <option selected>Seen – unmarked</option>
        <option>Not seen – eggs present</option>
        <option>Not seen – no eggs</option>
      </select>

      <label for="notes">Inspection Notes</label>
      <textarea id="notes" name="notes" rows="4">Brood pattern sparse. Consider adding frame of eggs next visit.</textarea>

      <label for="photo">Replace Photo (optional)</label>
      <input type="file" id="photo" name="photo" accept="image/*" />

      <button type="submit" class="btn-primary">Update Inspection</button>
    </form>
  </main>
