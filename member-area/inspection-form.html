  <main class="page">
    <h2>Hive Inspection Form</h2>
    <form class="form-card" id="inspection-form">
      <label for="inspection-date">Date & Time</label>
      <input type="datetime-local" id="inspection-date" name="date" required>

      <label for="inspection-weather">Weather</label>
      <input type="text" id="inspection-weather" name="weather" readonly>

      <label for="inspection-temp">Temperature (°C)</label>
      <input type="text" id="inspection-temp" name="temp" readonly>

      <label for="apiary">Apiary</label>
      <select id="apiary" name="apiary" required>
        <option value="">Select Apiary</option>
        <option>Orchard Apiary</option>
        <option>Garden Apiary</option>
      </select>

      <label for="hive">Hive</label>
      <select id="hive" name="hive" required>
        <option value="">Select Hive</option>
        <option>Hive A</option>
        <option>Hive B</option>
      </select>

      <label><input type="checkbox" name="activity"> Bees actively entering/exiting</label>
      <label><input type="checkbox" name="pollen"> Bees bringing in pollen</label>
      <label><input type="checkbox" name="robbing"> Signs of robbing</label>
      <label><input type="checkbox" name="calm_open"> Calm when opening hive</label>

      <label for="temperament">Temperament</label>
      <select id="temperament" name="temperament">
        <option>Calm</option>
        <option>Nervous</option>
        <option>Aggressive</option>
        <option>Other</option>
      </select>

      <label for="population">Population</label>
      <select id="population" name="population">
        <option>Low</option>
        <option>Average</option>
        <option>Good</option>
      </select>

      <fieldset>
        <legend>What was seen</legend>
        <label><input type="checkbox" name="seen" value="queen"> Queen</label>
        <label><input type="checkbox" name="seen" value="eggs"> Eggs</label>
        <label><input type="checkbox" name="seen" value="capped"> Capped Brood</label>
        <label><input type="checkbox" name="seen" value="uncapped"> Uncapped Brood</label>
        <label><input type="checkbox" name="seen" value="none" onclick="clearOtherSeen(this)"> None</label>
      </fieldset>

      <label for="brood">Brood Pattern</label>
      <select id="brood" name="brood">
        <option>No Brood</option>
        <option>Spotty</option>
        <option>Solid</option>
      </select>

      <fieldset>
        <legend>Diseases or Pests</legend>
        <label><input type="checkbox" name="pests" value="varroa"> Varroa Mites</label>
        <label><input type="checkbox" name="pests" value="chalkbrood"> Chalkbrood</label>
        <label><input type="checkbox" name="pests" value="sacbrood"> Sacbrood</label>
        <label><input type="checkbox" name="pests" value="afb"> AFB</label>
        <label><input type="checkbox" name="pests" value="efb"> EFB</label>
        <label><input type="checkbox" name="pests" value="nosema"> Nosema</label>
        <label><input type="checkbox" name="pests" value="beetles"> Beetles</label>
        <label><input type="checkbox" name="pests" value="mice"> Mice</label>
        <label><input type="checkbox" name="pests" value="ants"> Ants</label>
        <label><input type="checkbox" name="pests" value="waxmoth"> Wax Moth</label>
        <label><input type="checkbox" name="pests" value="wasps"> Wasps</label>
        <label><input type="checkbox" name="pests" value="woodpecker"> Woodpeckers</label>
        <label><input type="checkbox" name="pests" value="other"> Other</label>
        <label><input type="checkbox" name="pests" value="none"> None</label>
      </fieldset>

      <label for="supers">Supers</label>
      <select id="supers" name="supers">
        <option>No Change</option>
        <option>Added</option>
        <option>Removed</option>
      </select>

      <label for="excluder">Queen Excluder</label>
      <select id="excluder" name="excluder">
        <option>No Change</option>
        <option>Added</option>
        <option>Removed</option>
      </select>

      <label for="comments">Comments</label>
      <textarea id="comments" name="comments" rows="4"></textarea>

      <label for="photos">Upload Photos</label>
      <input type="file" id="photos" name="photos" accept="image/*" multiple>

      <button type="submit" class="btn-primary">Complete Inspection</button>
      <button type="button" class="btn-secondary" onclick="cloneInspection()">Clone for Another Hive</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/scripts.js"></script>
  <script>
    // Auto-fill weather and temperature (stubbed for now)
    window.onload = () => {
      document.getElementById("inspection-weather").value = "Sunny";
      document.getElementById("inspection-temp").value = "22";
    };

    function clearOtherSeen(box) {
      if (box.checked) {
        const seen = document.querySelectorAll("input[name='seen']");
        seen.forEach(cb => { if (cb !== box) cb.checked = false; });
      }
    }

    function cloneInspection() {
      alert("Inspection cloned! Please update the hive selection and adjust details.");
    }
  </script>
