        </li>

    </nav>
  </header>

  <main class="page">
    <h2>Manage Group: Orchard Beekeepers</h2>

    <form class="form-card" action="groups.html" method="POST">
      <label for="group-name">Group Name</label>
      <input type="text" id="group-name" name="group-name" value="Orchard Beekeepers" required />

      <label for="group-description">Group Description</label>
      <textarea id="group-description" name="group-description" rows="3">A group of hobbyist beekeepers managing Orchard Apiary.</textarea>

      <h3>Members</h3>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Member</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>alice@beekeeper.com</td>
              <td>
                <select name="role-alice">
                  <option>View Only</option>
                  <option selected>Edit Access</option>
                  <option>Admin</option>
                </select>
              </td>
              <td><button type="button" class="btn-danger">Remove</button></td>
            </tr>
            <tr>
              <td>bob@beekeeper.com</td>
              <td>
                <select name="role-bob">
                  <option selected>View Only</option>
                  <option>Edit Access</option>
                  <option>Admin</option>
                </select>
              </td>
              <td><button type="button" class="btn-danger">Remove</button></td>
            </tr>
          </tbody>
        </table>
      </div>

      <h3>Add Member</h3>
      <div class="invite-section">
        <label for="new-member-email">Email or Username</label>
        <input type="email" id="new-member-email" name="new-member-email" placeholder="Enter member email" />

        <label for="new-member-role">Role</label>
        <select id="new-member-role" name="new-member-role">
          <option>View Only</option>
          <option>Edit Access</option>
          <option>Admin</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Save Changes</button>
        <button type="button" class="btn-danger">Delete Group</button>
      </div>
    </form>
  </main>
